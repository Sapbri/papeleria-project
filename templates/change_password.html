{% extends "layout.html" %}

{% block title %}
    Cambiar Contraseña
{% endblock %}

{% block main %}
    <div class="row justify-content-center mt-5">
        <div class="col-11 col-md-6 col-lg-4">
            <div class="card bg-light border-secondary border-2 shadow-sm rounded-3">
                <div class="card-body p-4 text-center">
                
                    <h3 class="card-title mb-4 fw-bold text-secondary">Iniciar Sesión</h3>

                    <form action="/cambiar_clave" method="post">
                        <div class="mb-3">
                            <input autocomplete="off" autofocus class="form-control border-secondary-subtle" name="current_password" placeholder="Escriba contraseña actual" type="password" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control border-secondary-subtle" name="new_password" placeholder="Escriba su nueva contraseña" type="password" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control border-secondary-subtle" name="confirmation_password" placeholder="Confirme su nueva contraseña" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100 fw-semibold" type="submit">Cambiar Contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
