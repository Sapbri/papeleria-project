{% extends "layout.html" %}

{% block title %}
    Registrar Empleado
{% endblock %}

{% block main %}
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Tarjeta Principal -->
                <div class="card border-secondary border-2 shadow-sm rounded-3 overflow-hidden">
                    <div class="card-header bg-secondary-subtle border-bottom border-2 py-3">
                        <h4 class="fw-bold text-dark mb-0 text-start">
                            <i class="bi bi-person-plus-fill me-2 text-primary"></i>Registrar Nuevo Empleado
                        </h4>
                    </div>
                    
                    <div class="card-body p-4 text-start bg-light">
                        <form action="/usuarios/registrar" method="POST">
                            
                            <!-- Nombre de Usuario -->
                            <div class="mb-3">
                                <label for="username_nuevo_usuario" class="form-label fw-semibold">Nombre de usuario</label>
                                <input type="text" 
                                       class="form-control border-secondary" 
                                       id="username" 
                                       name="username_nuevo_usuario" 
                                       placeholder="Ej. juan_perez" 
                                       autocomplete="off" 
                                       minlength="3" 
                                       maxlength="30" 
                                       required 
                                       autofocus>
                                <div class="form-text">Mínimo 3 caracteres, sin espacios.</div>
                            </div>

                            <!-- Rol en el sistema -->
                            <div class="mb-3">
                                <label for="role" class="form-label fw-semibold">Rol del empleado</label>
                                <select class="form-select border-secondary text-muted" id="role" name="role_nuevo_usuario" required>
                                    <option value="" disabled selected>Selecciona un rol...</option>
                                    <option value="cajero">Cajero</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password_nuevo_usuario" class="form-label fw-semibold">Contraseña inicial</label>
                                <input type="password" 
                                       class="form-control border-secondary" 
                                       id="password" 
                                       name="password_nuevo_usuario" 
                                       placeholder="Digite la clave del nuevo usuario" 
                                       minlength="6" 
                                       required>
                                <div class="form-text">Mínimo 6 caracteres.</div>
                            </div>

                            <!-- Confirmar Contraseña -->
                            <div class="mb-4">
                                <label for="confirmation_nuevo_usuario" class="form-label fw-semibold">Confirmar contraseña</label>
                                <input type="password" 
                                       class="form-control border-secondary" 
                                       id="confirmation" 
                                       name="confirmation_nuevo_usuario" 
                                       placeholder="Confirme la clave del nuevo usuario" 
                                       minlength="6" 
                                       required>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex justify-content-end gap-2 pt-2 border-top border-secondary-subtle">
                                <a href="/usuarios" class="btn btn-outline-secondary border-secondary fw-semibold">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary fw-semibold">
                                    <i class="bi bi-check-circle-fill me-1"></i> Guardar Empleado
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
